name: Atlas checks

on:
  push:
    branches:
      - main
      - feature/japon-2027
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          find . -type f \( -name '*.js' -o -name '*.cjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Validate trip JSON
        run: |
          node -e "const fs=require('node:fs');for(const f of fs.readdirSync('data/trips').filter(f=>f.endsWith('.json'))){JSON.parse(fs.readFileSync('data/trips/'+f,'utf8'));}"
      - name: Enforce PR trip change scope
        if: github.event_name == 'pull_request'
        env:
          ATLAS_SCOPE_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.head_ref }}
        run: |
          # Refactors cannot change travel data. Other PRs declare authorized slugs
          # in a single "Atlas scope: slug1,slug2" line (or "Atlas scope: none").
          if [[ "$PR_HEAD" == refactor/* ]]; then
            export ATLAS_SCOPE_TRIPS=''
          else
            scope=$(printf '%s\n' "$PR_BODY" | sed -n 's/^Atlas scope: //p' | tr -d '\r')
            if [[ -z "$scope" ]]; then
              echo 'Missing Atlas scope declaration in PR description' >&2
              exit 1
            fi
            export ATLAS_SCOPE_TRIPS="$scope"
            if [[ "$scope" == none ]]; then export ATLAS_SCOPE_TRIPS=''; fi
          fi
          node --test tests/editorial/change-scope.test.cjs
      - name: Run editorial V2 tests
        env:
          ATLAS_QA_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node --test $(find tests/editorial -type f -name '*.test.cjs' | sort)
      - name: Run functional V2 tests
        run: node --test $(find tests/functional -type f -name '*.test.cjs' | sort)
      - name: Install Chromium browser for UI regression
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Desktop and Mobile browser smoke and editorial audit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          node tests/browser/smoke.cjs
